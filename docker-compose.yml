services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gaming_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    env_file:
      - .env                             
    environment:
      - MLFLOW_TRACKING_URI=https://dagshub.com/evaldocunhaf/MLOPs-Cesar.mlflow
      - MODEL_URI=models:/gaming-mental-health/latest
    restart: always

  web:
    build: ./web
    container_name: gaming_web
    ports:
      - "8501:80"
    depends_on:
      - api
    restart: always
